<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jorge Ponce Loyola — Ingeniero de Software</title>
    <meta name="description" content="Portafolio de Jorge Ponce Loyola, Ingeniero de Software basado en Lima, Perú." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme/lang before first paint to avoid a flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('jpl-theme') || 'light';
        document.documentElement.lang = localStorage.getItem('jpl-lang') || 'es';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
